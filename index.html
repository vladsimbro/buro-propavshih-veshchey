<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бюро пропавших вещей</title><style>
:root{color-scheme:dark;--ink:#ede0c4;--muted:#b4aa95;--gold:#dab579}*{box-sizing:border-box}body{margin:0;background:#10191b;color:var(--ink);font:16px/1.6 Georgia,serif}button{font:13px/1.4 'Courier New',monospace;cursor:pointer;color:inherit;background:#263033;border:1px solid #657070;padding:12px 17px;transition:.2s}button:hover{background:#44483d;border-color:var(--gold)}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{opacity:.4;cursor:default}.gold{background:#c5a36c;color:#171e1e;border-color:#c5a36c}.small,header,footer,.eyebrow{font:11px/1.6 'Courier New',monospace;letter-spacing:2px;text-transform:uppercase}header{padding:23px 4%;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff16;align-items:center}header button{padding:8px 12px}.brand{letter-spacing:3px}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:55% 45%;min-height:calc(100vh - 88px)}.scene{position:relative;min-height:720px;overflow:hidden;border-right:1px solid #ffffff15;background:radial-gradient(ellipse at 72% 52%,#87704430,transparent 55%),#142023}.window{position:absolute;left:8%;top:6%;width:67%;height:36%;border:12px solid #243033;box-shadow:0 0 0 2px #0b1113,inset 0 0 60px #000;background:linear-gradient(90deg,transparent 49%,#283539 49%,#283539 51%,transparent 51%),linear-gradient(transparent 47%,#283539 47%,#283539 51%,transparent 51%),linear-gradient(145deg,#12292e,#090e13)}.rain{position:absolute;inset:0;opacity:.4;background:repeating-linear-gradient(104deg,transparent 0 34px,#82989b45 35px,transparent 36px 65px);background-size:100% 190%;animation:rain 3s linear infinite}@keyframes rain{to{background-position:0 190%}}.window:after{content:'НОЧНОЕ БЮРО • ОКНО № 4';position:absolute;bottom:14px;left:20px;font:10px monospace;letter-spacing:2px;color:#7d9395}.lamp{position:absolute;right:4%;top:16%;width:145px;height:240px;border-right:8px solid #42443b;transform:rotate(-12deg);filter:drop-shadow(0 6px 6px #000)}.lamp:before{content:'';position:absolute;right:-38px;top:-10px;width:180px;height:76px;background:linear-gradient(#617165,#293a32);border-radius:100% 100% 15% 15%;border-bottom:8px solid #ffe6a4;box-shadow:0 30px 65px #eac57c50}.lamp:after{content:'';position:absolute;bottom:0;right:-55px;width:120px;height:20px;border-radius:50%;background:#343f37}.desk{position:absolute;bottom:0;width:100%;height:55%;background:radial-gradient(ellipse at 75% 0%,#a17a4666,transparent 65%),repeating-linear-gradient(2deg,#0000 0 18px,#090b0b20 19px 20px),linear-gradient(120deg,#4d392a,#30291f);box-shadow:0 -12px 30px #0007;border-top:7px solid #5a4935}.desk:after{content:'';position:absolute;left:15%;top:60%;width:170px;height:3px;background:#b19a6235;transform:rotate(-18deg);pointer-events:none}.desk-label{position:absolute;top:12px;left:6%;color:#c6b58c;font:10px monospace;letter-spacing:3px}.objects{position:absolute;top:14%;left:4%;right:4%;display:flex;gap:6px;align-items:center}.object{width:33.33%;padding:0;background:none;border:0;position:relative}.object:hover{background:#e0be7920}.object svg{width:100%;height:145px;filter:drop-shadow(3px 12px 5px #0008)}.object span{display:block;font-size:11px;letter-spacing:1px}.object.gone{opacity:.35}.cards{position:absolute;bottom:13%;left:8%;display:flex;gap:12px;transform:rotate(-3deg)}.card{color:#453c30;background:#c6b899;padding:13px 14px;width:132px;box-shadow:3px 5px 8px #0006;font:11px/1.7 monospace;border:0}.card.active{background:#e3d5b5;transform:translateY(-8px)}.card b{display:block;font:18px Georgia}.caption{position:absolute;bottom:22px;left:8%;font:italic 14px Georgia;color:#b8aa8c}.story{padding:40px 9% 25px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(ellipse at 0% 40%,#75604212,transparent 70%)}h1{font-size:clamp(38px,4.1vw,64px);line-height:1.05;font-weight:normal;margin:12px 0 25px}h2{font-size:34px;line-height:1.15;font-weight:normal;margin:6px 0 15px}p{margin:0 0 16px}.eyebrow{color:var(--gold)}.intro{color:#c5bda9}.rule{border-left:2px solid #ac8f5d;padding-left:18px;font-size:14px;color:var(--muted)}.line{height:1px;background:#ffffff18;margin:7px 0}.speaker{font:12px monospace;color:var(--gold);letter-spacing:2px}.dialogue{font-size:18px}.choices{display:grid;gap:8px}.choices button{text-align:left}.actions{display:flex;flex-wrap:wrap;gap:8px}.note{font-style:italic;font-size:14px;color:var(--muted)}footer{margin-top:auto;padding-top:15px;color:#89938e;display:flex;justify-content:space-between}.journal-btn{border:0;background:none;padding:0;color:#c6b58c}.overlay{background:#050a0bdc;border:1px solid #847756;color:var(--ink);padding:0;width:min(850px,94vw);max-height:90vh;box-shadow:0 20px 100px #000}dialog::backdrop{background:#02060980;backdrop-filter:blur(2px)}.modal-head{padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18}.modal-body{padding:28px}.inspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.close{padding:6px 12px}.large-object{background:radial-gradient(ellipse,#b794493b,transparent 70%)}.large-object svg{width:100%;height:300px;filter:drop-shadow(0 15px 10px #000)}.detail{border-top:1px solid #ffffff20;padding:13px 0;font-size:15px}.journal-entry{padding:18px 0;border-bottom:1px solid #ffffff25}.journal-entry p{font-size:14px}.end-stamp{font:11px monospace;letter-spacing:3px;border:1px solid #ae9161;color:#d6ba83;padding:7px 12px;display:inline-block;margin-bottom:15px}@media(max-width:850px){.layout{grid-template-columns:1fr}.scene{min-height:440px;border-right:0}.story{padding:30px 7%}.window{top:5%;height:36%}.lamp{top:5%;height:180px;transform:scale(.7)}.desk{height:56%}.object svg{height:100px}.cards{bottom:9%;gap:7px}.card{width:105px;padding:7px;font-size:9px}.card b{font-size:15px}.caption{display:none}.inspect-grid{grid-template-columns:1fr}.large-object svg{height:180px}.brand{font-size:9px}header{padding:15px 5%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><span class="brand">БПВ / НОЧНАЯ СМЕНА</span><button id="sound" aria-pressed="false">◌ Звук выключен</button></header><main class="layout"><section class="scene" aria-label="Стол ночного бюро"><div class="window"><div class="rain"></div></div><div class="lamp"></div><div class="desk"><div class="desk-label">ХРАНЕНИЕ ДО ВОСТРЕБОВАНИЯ</div><div class="objects" id="objects"></div><div class="cards" id="cards"></div><div class="caption">Некоторые вещи лучше не возвращать.</div></div></section><section class="story" id="story"></section></main><dialog class="overlay" id="modal"><div class="modal-head"><span class="eyebrow" id="modal-title"></span><button class="close" id="close" aria-label="Закрыть">✕</button></div><div class="modal-body" id="modal-body"></div></dialog><script>
const art=[`<svg viewBox="0 0 240 180" aria-hidden="true"><defs><linearGradient id="metal"><stop stop-color="#a18b5d"/><stop offset=".45" stop-color="#e2c78a"/><stop offset="1" stop-color="#736447"/></linearGradient></defs><g transform="rotate(-29 120 90)" fill="url(#metal)" stroke="#5f543c" stroke-width="2"><circle cx="65" cy="85" r="31"/><circle cx="65" cy="85" r="17" fill="#342f25"/><path d="M94 77H205V96H191V116H178V97H162V108H148V96H94Z"/><path d="M132 78v7" stroke="#2b2821" stroke-width="4"/><path d="M38 66q-25-22-31 7q-4 15 13 25" fill="none" stroke="#547383" stroke-width="7"/></g></svg>`,`<svg viewBox="0 0 240 180" aria-hidden="true"><g transform="rotate(9 120 90)"><rect x="25" y="40" width="190" height="113" rx="8" fill="#282b28" stroke="#737268" stroke-width="2"/><rect x="38" y="50" width="164" height="63" rx="3" fill="#bdb28f"/><text x="50" y="72" fill="#454338" font-size="16" font-family="cursive">Для Лены. 03:17</text><rect x="60" y="80" width="120" height="25" rx="10" fill="#454b45"/><circle cx="80" cy="92" r="13" fill="#b7b5a2"/><circle cx="160" cy="92" r="13" fill="#b7b5a2"/><circle cx="80" cy="92" r="6" fill="#262e2a"/><circle cx="160" cy="92" r="6" fill="#262e2a"/><path d="M66 145l12-25h85l13 25Z" fill="#454940"/ ><circle cx="47" cy="134" r="3" fill="#a8a88f"/><circle cx="193" cy="134" r="3" fill="#a8a88f"/><path d="M204 46l-9 11 8 10-13 8" stroke="#151917" fill="none" stroke-width="2"/></g></svg>`,`<svg viewBox="0 0 240 180" aria-hidden="true"><defs><pattern id="knit" width="7" height="8" patternUnits="userSpaceOnUse"><path d="M1 1l3 5 3-5" stroke="#c48067" fill="none" stroke-width="1"/></pattern></defs><g transform="rotate(17 120 90)"><path d="M86 145V111Q54 100 61 79Q68 62 84 80V45Q88 19 115 22Q145 23 147 48V122L141 148Z" fill="#a75f4c" stroke="#593e32" stroke-width="2"/><path d="M86 145V111Q54 100 61 79Q68 62 84 80V45Q88 19 115 22Q145 23 147 48V122L141 148Z" fill="url(#knit)"/><path d="M87 126h57v25H87Z" fill="#704b40"/><path d="M95 128v21m8-21v21m8-21v21m8-21v21m8-21v21m8-21v21" stroke="#b37a62"/><path d="M111 56l3 8 8 2-7 5 1 8-7-5-8 3 3-8-4-6 9 1Z" fill="#dec898"/></g></svg>`];
const items=[{name:'Чужой ключ',details:['Синяя нитка завязана на кольце. Узел затянут плоскогубцами.','На стержне одна глубокая насечка. Она слишком ровная для случайной царапины.'],hidden:'Под синей ниткой выбито «К–4». Нитка закрывала клеймо, а не украшала ключ.',act:'Сдвинуть нитку'}, {name:'Кассета',details:['На бумажной этикетке: «Для Лены. 03:17». Чернила расплылись от воды.','У правого винта треснул корпус. Язычки защиты от записи выломаны.'],hidden:'Через наушник служебного плеера: три удара по трубе, затем мужской голос: «Я снаружи. Не стучите: ребёнок спит». Щелчок замка. Запись обрывается.',act:'Послушать начало'}, {name:'Детская варежка',details:['Рыжая шерсть. На тыльной стороне вышита неровная жёлтая звезда.','Большой палец заштопан синими нитками; манжета растянута.'],hidden:'Внутри манжеты пришита полоска ткани: «Лена, левая». Под ней — маленькая латунная шайба, тёплая от лампы.',act:'Вывернуть манжету'}];
const visitors=[{name:'Виктор Серов',role:'ЭЛЕКТРИК • КЛЮЧ',time:'02:41',intro:'«Доброй ночи. Мне бы ключ с синей ниткой. Без него насосную не закрыть, а я уже двенадцать часов на ногах. Давайте тихо, ладно? Ребёнок спит». Он кивает в сторону тёмного окна. За стеклом только дождь. Виктор снимает мокрую кепку, но пальцы на столе оставляет в сухих перчатках.',qs:[['Для чего насечка?','«Чтобы в темноте найти верх. Там замок стоит боком, его ещё при старом директоре перевернули. Проведёшь ногтем — и не надо фонариком будить весь дом. Раньше я по три раза промахивался». Он показывает движение большим пальцем. Слишком привычное, чтобы быть выдумкой.'],['Где вы потеряли ключ?','«У старой котельной, четвёртый вход. Нёс коробку с инструментами, зацепился ниткой за ручку. Ключ, наверное, в лужу ушёл. Только не пишите “котельная”, у нас по документам насосная. А то опять проверяющие приедут». Он поправляет вас ещё до того, как вы берётесь за ручку.'],['Какой ребёнок спит?','Виктор смотрит на окно чуть дольше, чем нужно. «Моя. В машине. Долго объяснять, почему ночью со мной. Вы ключ отдайте, и мы домой. Дети, знаете, хуже всего запоминают, когда взрослые начинают кричать». На улице не слышно ни двигателя, ни хлопка автомобильной двери.'],['Кто ещё пользуется дверью?','«Никто. Я отвечаю за помещение. Разве что женщина одна ходит: считает, там остались её документы. Официально вход закрыт. Если придёт, ключ ей не давайте. Она не в себе после несчастья». Он произносит это деловым голосом, словно зачитывает акт.'],['Почему пришли именно сейчас?','«Утром помещение опечатают. Мне надо до этого забрать журнал и перекрыть воду. Быстро: вошёл, вышел. Вы же тоже не хотите сидеть здесь до утра?» Он замечает часы за вашей спиной и перестаёт улыбаться. Часы отстают на одиннадцать минут; его наручные показывают столько же.']],proof:'«Под ниткой — К–4. Четвёртая котельная. Я сам клеймо набивал, ещё когда там был детский кружок. Нитку намотал, чтобы не звенел». Он знает скрытую примету. Но право владеть ключом ничего не говорит о том, зачем ему дверь сегодня.',give:'Виктор прячет ключ в перчатку. «Вот и хорошо. Пусть спит». Колокольчик звенит один раз; дверь он придерживает рукой.',keep:'Виктор долго смотрит на ящик. «Значит, до утра». Он уходит, не забрав кепку. Впервые за разговор его голос звучит устало, а не вежливо.'},
{name:'Ирина Белова',role:'ЗВУКОРЕЖИССЁР • КАССЕТА',time:'03:02',intro:'Женщина кладёт на край стола пустой прозрачный футляр. «Я ищу кассету. На ней моим почерком — “Для Лены”. Это не музыка. Пожалуйста, не стирайте её, даже если вам скажут, что там просто шум». Её рука дрожит, когда она пытается совместить половинки сломанного футляра.',qs:[['Что записано на кассете?','«Трубы. Дверь. Голос дежурного. Я ставила магнитофон в котельной, собирала звуки для радиоспектакля. Потом случился пожар. В акте написали: дверь заклинило изнутри. Но на ленте замок поворачивается снаружи. Между тремя ударами и щелчком — шесть секунд. Я их считала неделю».'],['Кто такая Лена?','«Девочка из кружка. Мы записывали с ней сказки. Ей было семь, она всё время поправляла меня: волк не должен говорить злым голосом, иначе сразу понятно, кто он. Я подписала копию для неё, но эту кассету так и не отдала. Двадцать лет таскала с собой».'],['Зачем она нужна сегодня?','«В шесть утра придёт следователь. Старое дело открыли заново: нашлась свидетельница. Я обещала принести оригинал, а по дороге выронила футляр. Если оставите ленту здесь, опечатайте пакет и передайте лично следователю. Только не дежурному из котельной. Он уже однажды “проверял” эту запись».'],['Почему не сделали копию?','«Копия есть, цифровая. Но защита говорит: монтаж. Нужен сам носитель, склейки, шум ленты. Да, я должна была давно отнести его. Я боялась, что голос узнают и начнут спрашивать, почему я слышала удары, а сама не побежала к двери. Магнитофон работал без меня. Я всё равно слышу эти удары во сне».'],['Что случилось с футляром?','«У четвёртого входа меня толкнул человек в кепке. Не ограбил — просто встал на пути. Футляр упал и раскрылся. Я побежала к остановке, а уже там заметила, что он пустой. Кассета должна быть с трещиной у правого винта. Если она целая, значит, это другая».']],proof:'«В начале три удара по трубе. Потом мужчина говорит: “Я снаружи. Не стучите: ребёнок спит”. Он врал: Лена была за дверью и стучала. На обороте пусто, я боялась случайно записать поверх». Ирина закрывает глаза ещё до того, как вы заканчиваете проверку.',give:'Ирина заворачивает кассету в шарф. «В отделение. Прямо сейчас. Я позвоню вам, когда сдам». На карточке она оставляет номер расписки, который ей обещали выдать.',keep:'Вы запечатываете кассету в конверт и ставите подпись на шве. Ирина записывает фамилию следователя: Орлов. «Передайте ему в шесть. Пожалуйста». Конверт остаётся в ящике стола.'},
{name:'Елена',role:'БЕЗ ДОКУМЕНТОВ • ВАРЕЖКА',time:'03:17',intro:'Третья посетительница не садится. Она взрослая, лет двадцати семи, но её ладони почти детские. «У вас должна быть левая варежка. Рыжая. Я знаю, это странно — искать её столько лет». Она смотрит не на варежку, а на стул у края стола. «Он уже был здесь?»',qs:[['Почему только левая?','«Правую я потеряла, когда лезла в окно. Левая зацепилась за гвоздь у вентиляции. Мама штопала на ней палец синими нитками, других не было. Я сердилась: две варежки стали разными. Потом только по этой заплатке и могла доказать себе, что помню всё правильно».'],['Как вы выбрались?','«Через окно под потолком. Ирина ушла за батарейками, а нас заперли. Я стучала шайбой по трубе, пока не услышала шаги. Думала, откроют. Вместо этого щёлкнул замок. Я встала на стул, разбила форточку. Остальные уже лежали на полу. Не спрашивайте, почему я одна».'],['Зачем вам варежка сейчас?','«В манжете осталась шайба. Я хочу положить её перед следователем, чтобы руки перестали трястись. Но если боитесь отдавать — сохраните как улику. Только запишите, что за ней пришла Елена. Не “неизвестная женщина”, не “девочка из акта”. Я столько лет была строкой без имени».'],['Вы знаете Виктора?','«Он следил за котельной. На двери была насечка от его ключа, и он всегда объяснял людям, какой стороной вставлять. Хороший работник, говорили соседи. На суде он сказал, что меня там не было. Что ребёнок спал у него в машине. Я не его дочь. У него никогда не было детей».'],['Почему вы молчали двадцать лет?','«Сначала мне не верили. Потом я решила, что и сама придумала голос за дверью. Когда Ирина нашла меня, я согласилась прийти только после того, как она назвала три удара. Их не было в газетах. Сегодня я впервые пришла в это бюро своим именем. До сих пор хочется уйти».']],proof:'«Под подкладкой латунная шайба. Я называла её луной. На ленточке мама написала “Лена, левая”, потому что я путала руки. Шайбой я стучала по трубе — три раза, как она учила: если страшно, пусть кто-нибудь услышит».',give:'Елена держит варежку обеими руками, не пытаясь надеть. «Я пойду к Ирине. Теперь у меня есть что показать, кроме шрама».',keep:'Вы подписываете второй пакет: «Елена. Принято лично». Она читает своё имя и кивает. «Хорошо. Тогда я останусь здесь до следователя. Можно у лампы?»'}];
let state={started:false,i:0,asked:[[],[],[]],proof:[false,false,false],decisions:[],inspect:[false,false,false],hidden:[false,false,false],phase:'talk'};try{const x=JSON.parse(localStorage.getItem('buro-v1'));if(x&&x.asked&&x.i>=0&&x.i<=3)state=x}catch(e){}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('buro-v1',JSON.stringify(state))}catch(e){}}function escapeHTML(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function footer(){return `<footer><span>СМЕНА 04 / ${state.started?Math.min(state.i+1,3)+'/3':'7–10 МИНУТ'}</span><button class="journal-btn" onclick="journal()">Журнал ↗</button></footer>`}function render(){save();$('objects').innerHTML=items.map((o,i)=>`<button class="object ${state.decisions[i]==='give'?'gone':''}" onclick="inspect(${i})" aria-label="Осмотреть: ${o.name}">${art[i]}<span>0${i+1} / ${o.name}${state.decisions[i]==='give'?' · выдано':''}</span></button>`).join('');$('cards').innerHTML=visitors.map((v,i)=>`<div class="card ${state.started&&state.i===i?'active':''}"><span>ДЕЛО 0${i+1} / ${v.time}</span><b>${state.started&&i<=state.i?v.name:'Ожидается'}</b>${state.decisions[i]?state.decisions[i]==='give'?'ВЫДАНО':'ОСТАВЛЕНО':'БЕЗ РЕШЕНИЯ'}</div>`).join('');if(!state.started){$('story').innerHTML=`<div class="eyebrow">ИНТЕРАКТИВНЫЙ НОЧНОЙ ТРИЛЛЕР</div><h1>Бюро<br>пропавших<br><i>вещей</i></h1><p class="intro">Вещи возвращаются к людям.<br>Иногда — чтобы люди вернулись к прошлому.</p><div class="line"></div><p>Ноябрь. До рассвета — одна смена. В журнале находок три записи: ключ, кассета, варежка. Их принесли из сносимой котельной на Заречной. В пакетах нет ни имён, ни адресов.</p><p class="rule">Осматривайте предметы. Задайте каждому посетителю три вопроса из пяти. Затем отдайте вещь, оставьте её в бюро или сначала проверьте скрытую примету. Решения окончательны.</p><button class="gold" onclick="start()">Принять смену →</button><div class="note">Без таймера. Прогресс сохраняется в этом браузере.</div>${footer()}`;return}if(state.i===3){ending();return}const v=visitors[state.i],a=state.asked[state.i];let body=`<div class="eyebrow">${v.time} / ПОСЕТИТЕЛЬ 0${state.i+1}</div><h2>${v.name}</h2><div class="speaker">${v.role}</div>`;if(state.phase==='after'){body+=`<p class="dialogue">${v[state.decisions[state.i]]}</p><p class="note">Решение внесено в журнал. ${state.i===0?(state.decisions[0]==='give'?'За окном скользит полоска фонарика в сторону котельной.':'Из телефонной трубки на столе слышится короткий щелчок. Вы ещё не снимали её.'):'Дождь усиливается. Стекло кажется непрозрачным.'}</p><button class="gold" onclick="next()">${state.i===2?'Дождаться рассвета':'Следующий посетитель'} →</button>`}else{body+=`<p class="dialogue">${a.length?v.qs[a[a.length-1]][1]:v.intro}</p>`;if(a.length)body+=`<p class="note">Вы спросили: ${v.qs[a[a.length-1]][0]}</p>`;if(a.length<3){body+=`<div class="eyebrow">ВОПРОСЫ ${a.length}/3 · ВЫБЕРИТЕ ${3-a.length}</div><div class="choices">${v.qs.map((q,j)=>a.includes(j)?'':`<button onclick="ask(${j})">${q[0]} <span aria-hidden="true">↗</span></button>`).join('')}</div>`}else{body+=`<div class="line"></div><p class="note">Три ответа записаны. Осмотрите вещь и примите решение.</p>`;if(state.proof[state.i])body+=`<p>${v.proof}</p><p class="eyebrow">ПРОВЕРКА ЗАПИСАНА · РЕШЕНИЕ ЗА ВАМИ</p>`;body+=`<div class="actions"><button class="gold" onclick="decide('give')">Отдать вещь</button><button onclick="decide('keep')">Оставить в бюро</button>${!state.proof[state.i]?'<button onclick="proof()">Назовите скрытую примету</button>':''}</div>`}}$('story').innerHTML=body+footer()}
function start(){state.started=true;save();bell();render()}function ask(j){if(state.phase!=='talk'||state.i>=3||state.asked[state.i].length>=3||state.asked[state.i].includes(j))return;state.asked[state.i].push(j);render()}function proof(){if(state.asked[state.i].length!==3)return;state.proof[state.i]=true;render()}function decide(d){if(state.phase!=='talk'||state.asked[state.i].length!==3||!['give','keep'].includes(d))return;state.decisions[state.i]=d;state.phase='after';render()}function next(){if(state.phase!=='after')return;state.i++;state.phase='talk';bell();render()}function openModal(title,body){$('modal-title').textContent=title;$('modal-body').innerHTML=body;if(!$('modal').open)$('modal').showModal()}function inspect(i){state.inspect[i]=true;save();let gone=state.decisions[i]==='give';openModal('ОПИСЬ / 0'+(i+1),`<div class="inspect-grid"><div class="large-object">${art[i]}</div><div><h2>${items[i].name}</h2>${gone?'<p class="note">Предмет уже выдан. Перед вами зарисовка и записи осмотра.</p>':''}${items[i].details.map((d,n)=>`<div class="detail"><span class="eyebrow">0${n+1}</span><br>${d}</div>`).join('')}<div id="hidden">${state.hidden[i]?`<div class="detail">${items[i].hidden}</div>`:gone?'<p class="note">Скрытую деталь не проверили до выдачи.</p>':`<button onclick="reveal(${i})">${items[i].act} →</button>`}</div></div></div>`)}function reveal(i){if(state.decisions[i]==='give')return;state.hidden[i]=true;save();inspect(i)}function journal(){openModal('ЖУРНАЛ / НИЧЕГО НЕ ЗАБЫТО',visitors.map((v,i)=>`<div class="journal-entry"><h2>${i+1}. ${state.started&&i<=state.i?v.name:'Посетитель ещё не пришёл'}</h2>${state.asked[i].map(j=>`<p><b>${v.qs[j][0]}</b><br>${v.qs[j][1]}</p>`).join('')}${state.proof[i]?'<p><b>Скрытая примета:</b> '+v.proof+'</p>':''}<span class="eyebrow">${state.decisions[i]?(state.decisions[i]==='give'?'ВЕЩЬ ВЫДАНА':'ВЕЩЬ ОСТАВЛЕНА В БЮРО'):'РЕШЕНИЕ НЕ ПРИНЯТО'}</span></div>`).join(''))}function ending(){const key=state.decisions[0]==='give',tape=state.decisions[1]==='give',mitten=state.decisions[2]==='give';let text=key?`В 04:06 за окном вспыхивает жёлтый свет. Не рассвет: горит котельная. Виктор успел открыть дверь вашим ключом и уничтожить журнал дежурств. В нём были имена остальных детей — единственная зацепка, которая связывала его с запертой дверью.`:`В 04:06 кто-то долго дёргает дверь котельной. Потом уходит. Ключ лежит в вашем ящике: Виктор не смог забрать журнал дежурств до опечатывания. В шесть Орлов находит в нём подпись Серова и список детей.`;text+=tape?`<p>В 05:12 звонит Ирина. Кассета принята в отделении, расписка № 48. Вы записываете номер рядом с её фамилией. Голос на ленте теперь нельзя просто объявить слухом.</p>`:`<p>В шесть вы передаёте Орлову запечатанную кассету. Он сверяет подпись на конверте с вашей и кладёт его в отдельный пакет. Впервые за ночь вещь получает не владельца, а номер вещественного доказательства.</p>`;text+=mitten?`<p>Елена возвращается из отделения к вашему столу с Ириной. Варежка у неё в руках. Она сама согласилась передать шайбу на экспертизу; ткань ей разрешили оставить.</p>`:`<p>Елена дожидается следователя у лампы. Вы передаёте пакет с варежкой при ней. Орлов записывает её показания за вашим столом и впервые обращается к ней по имени.</p>`;text+=key?`<p>Её показания и лента сохранились. Но без журнала дело снова откладывают: адвокат утверждает, что Серов лишь запирал пустое помещение. Вы вернули ключ тому, кто действительно знал каждую его царапину. Этого оказалось недостаточно.</p>`:`<p>Лента, журнал и показания складываются в одну ночь. Орлов звонит из вашего бюро: Серова задержали у автобусной станции. Елена слушает и впервые отпускает край стола. Дело больше не держится на одной её памяти.</p>`;text+=`<p>Перед уходом она говорит: «Когда он сказал вам “ребёнок спит”, он не просил говорить тише. Он проверял, поверите ли вы ему ещё раз».</p><p class="note">На обороте первой карточки вы дописываете: «Детей у Виктора Серова не было».</p>`;$('story').innerHTML=`<div class="eyebrow">06:00 / СМЕНА ЗАКРЫТА</div><h2>${key?'То, что осталось в огне':'То, что удалось сохранить'}</h2><div><span class="end-stamp">ФИНАЛ ${key?'II':'I'} / II</span></div><div>${text}</div><div class="actions"><button onclick="journal()">Открыть журнал</button><button onclick="restartPrompt()">Новая смена</button></div>${footer()}`}function restartPrompt(){openModal('НОВАЯ СМЕНА','<p>Начать заново? Ответы и решения этой смены будут удалены.</p><button class="gold" onclick="restart()">Начать заново</button>')}function restart(){state={started:false,i:0,asked:[[],[],[]],proof:[false,false,false],decisions:[],inspect:[false,false,false],hidden:[false,false,false],phase:'talk'};$('modal').close();render()}
let ctx,master,on=false;async function toggleSound(){try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);let buffer=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.3;let noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;let filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1400;noise.connect(filter);filter.connect(master);noise.start()}await ctx.resume();on=!on;master.gain.setTargetAtTime(on?.16:0,ctx.currentTime,.15);$('sound').textContent=on?'◉ Звук включён':'◌ Звук выключен';$('sound').setAttribute('aria-pressed',on);if(on)bell()}catch(e){$('sound').textContent='Звук недоступен'}}function bell(){if(!ctx||!on)return;[880,1320].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.13;o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+1.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.4)})}$('sound').onclick=toggleSound;$('close').onclick=()=>$('modal').close();$('modal').addEventListener('click',e=>{if(e.target===$('modal')){let r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});render();
</script></html>
